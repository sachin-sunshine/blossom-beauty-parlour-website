<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blossom Beauty Parlour – Luxury Beauty & Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;overflow-x:hidden}
    .serif{font-family:'Cormorant Garamond',serif}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    @keyframes blob{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}}
    @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    .fade-up{animation:fadeInUp .8s ease forwards}
    .floating{animation:float 5s ease-in-out infinite}
    .blob-anim{animation:blob 9s ease-in-out infinite}
    .gradient-text{background:linear-gradient(135deg,#e11d48,#ec4899,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .gold-text{background:linear-gradient(135deg,#d4af37,#f5d060);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .card-hover{transition:all .3s ease}
    .card-hover:hover{transform:translateY(-8px);box-shadow:0 24px 48px rgba(225,29,72,.18)}
    .glass{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2)}
    .hero-bg{background:linear-gradient(135deg,#3b0020 0%,#831843 45%,#9d174d 75%,#4a0030 100%)}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

function useVisible(t=.15){
  const r=useRef(null);const[v,s]=useState(false);
  useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting)s(true)},{threshold:t});if(r.current)o.observe(r.current);return()=>o.disconnect()},[]);
  return[r,v];
}

function Counter({to,suf='',dur=2000}){
  const[n,setN]=useState(0);const[r,v]=useVisible();
  useEffect(()=>{if(!v)return;let c=0;const step=to/(dur/16);const t=setInterval(()=>{c+=step;if(c>=to){setN(to);clearInterval(t);}else setN(Math.floor(c));},16);return()=>clearInterval(t);},[v,to,dur]);
  return <span ref={r}>{n}{suf}</span>;
}

function Navbar(){
  const[sc,setSc]=useState(false);const[open,setOpen]=useState(false);
  useEffect(()=>{const h=()=>setSc(window.scrollY>60);window.addEventListener('scroll',h);return()=>window.removeEventListener('scroll',h)},[]);
  return(
    <nav className={`fixed w-full z-50 transition-all duration-300 ${sc?'bg-white shadow-lg':'bg-transparent'}`}>
      <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div className={`serif text-2xl italic font-semibold ${sc?'text-rose-800':'text-white'}`}>
          Blossom<span className="text-pink-400"> Beauty</span>
        </div>
        <div className="hidden md:flex items-center gap-8">
          {['Services','Pricing','Team','Gallery'].map(l=><a key={l} href={`#${l.toLowerCase()}`} className={`font-medium hover:text-pink-500 transition-colors ${sc?'text-gray-700':'text-white'}`}>{l}</a>)}
          <a href="#book" className="bg-gradient-to-r from-rose-600 to-pink-600 text-white px-6 py-2.5 rounded-full font-bold hover:opacity-90 transition-all hover:scale-105 shadow-lg">Book Now ✨</a>
        </div>
        <button onClick={()=>setOpen(!open)} className={`md:hidden text-2xl ${sc?'text-gray-900':'text-white'}`}>☰</button>
      </div>
      {open&&<div className="md:hidden bg-white shadow-xl border-t">
        {['Services','Pricing','Team','Gallery'].map(l=><a key={l} onClick={()=>setOpen(false)} href={`#${l.toLowerCase()}`} className="block px-6 py-4 text-gray-700 border-b hover:bg-pink-50">{l}</a>)}
        <div className="p-4"><a href="#book" className="block bg-gradient-to-r from-rose-600 to-pink-600 text-white text-center py-3 rounded-full font-bold">Book Now ✨</a></div>
      </div>}
    </nav>
  );
}

function OfferStrip(){
  return(
    <div className="bg-gradient-to-r from-rose-700 to-pink-700 text-white text-center py-3 text-sm font-medium">
      💝 <span className="bg-white/20 rounded-full px-3 py-0.5 mx-1">20% off on first visit</span>
      &nbsp;·&nbsp; Bridal packages available &nbsp;·&nbsp;
      <span className="bg-white/20 rounded-full px-3 py-0.5 mx-1">Free consultation</span>
    </div>
  );
}

function Hero(){
  return(
    <section className="hero-bg min-h-screen flex items-center relative overflow-hidden">
      <div className="absolute -top-20 -right-20 w-96 h-96 bg-pink-700/30 blob-anim"></div>
      <div className="absolute -bottom-10 -left-10 w-80 h-80 bg-rose-900/30 blob-anim" style={{animationDelay:'4s'}}></div>
      <div className="max-w-7xl mx-auto px-6 py-32 grid md:grid-cols-2 gap-12 items-center relative z-10">
        <div className="fade-up">
          <p className="text-pink-200 text-sm font-semibold uppercase tracking-[0.3em] mb-4">Premium Beauty & Wellness</p>
          <h1 className="serif text-6xl md:text-8xl italic text-white font-semibold leading-none mb-2">Glow Up</h1>
          <h2 className="text-3xl md:text-5xl font-black text-white mb-6">with <span className="gradient-text">Blossom</span></h2>
          <p className="text-pink-100 text-lg leading-relaxed mb-8 max-w-lg">Delhi's most loved beauty parlour. Expert stylists, luxury products, and a serene ambiance crafted entirely for you.</p>
          <div className="flex flex-wrap gap-4 mb-10">
            <a href="#book" className="bg-white text-rose-700 px-8 py-4 rounded-2xl font-bold text-lg hover:scale-105 transition-transform shadow-2xl">Book Appointment →</a>
            <a href="#pricing" className="glass text-white px-8 py-4 rounded-2xl font-bold text-lg hover:bg-white/15 transition-colors">See Pricing</a>
          </div>
          <div className="flex flex-wrap gap-3">
            {['💄 Expert Stylists','🌺 Luxury Products','✨ Hygienic & Clean','😌 Relaxing Ambiance'].map(b=>(
              <span key={b} className="glass text-pink-100 text-xs font-semibold px-4 py-2 rounded-full">{b}</span>
            ))}
          </div>
        </div>
        <div className="hidden md:flex justify-center">
          <div className="floating relative">
            <div className="absolute inset-0 bg-pink-500/20 rounded-full blur-3xl scale-125"></div>
            <div className="glass rounded-[2.5rem] p-10 text-center">
              <div className="text-8xl mb-4">💄</div>
              <div className="text-6xl mb-4">✨</div>
              <div className="grid grid-cols-2 gap-3 mt-4">
                <div className="bg-rose-900/40 rounded-xl p-3"><div className="text-white font-black text-xl">800+</div><div className="text-pink-300 text-xs">Brides Styled</div></div>
                <div className="bg-rose-900/40 rounded-xl p-3"><div className="text-white font-black text-xl">4.9★</div><div className="text-pink-300 text-xs">Rating</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function Stats(){
  const s=[{to:8,suf:'+',l:'Years of Excellence',i:'🎀'},{to:5000,suf:'+',l:'Happy Clients',i:'👩‍🦰'},{to:800,suf:'+',l:'Brides Styled',i:'👰'},{to:49,suf:'★ /5',l:'Average Rating',i:'⭐'}];
  return(
    <section className="bg-gradient-to-r from-rose-600 to-pink-700 py-16">
      <div className="max-w-7xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-6">
        {s.map(x=>(
          <div key={x.l} className="text-center group">
            <div className="text-4xl mb-3 group-hover:scale-125 transition-transform">{x.i}</div>
            <div className="text-4xl md:text-5xl font-black text-white mb-1"><Counter to={x.to} suf={x.suf}/></div>
            <div className="text-pink-200 font-medium text-sm">{x.l}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function Services(){
  const[r,v]=useVisible(.1);
  const svcs=[
    {i:'💇‍♀️',t:'Hair Styling',d:'Cuts, blow-dry, keratin treatment, smoothening, and creative colouring.',p:'From ₹499'},
    {i:'💅',t:'Manicure & Pedicure',d:'Classic, gel, acrylic extensions, and bespoke nail art designs.',p:'From ₹350'},
    {i:'✨',t:'Facial & Skin Care',d:'De-tan, brightening, gold & diamond facials, hydra facial treatments.',p:'From ₹699'},
    {i:'🕯️',t:'Waxing & Threading',d:'Full body waxing with Rica/chocolate wax. Precise brow and lip threading.',p:'From ₹150'},
    {i:'👰',t:'Bridal Makeup',d:'HD & airbrush bridal makeup, pre-bridal packages, hairstyling.',p:'From ₹8,999'},
    {i:'🧖‍♀️',t:'Spa & Relaxation',d:'Head massage, body massage, aromatherapy and foot reflexology.',p:'From ₹1,199'},
  ];
  return(
    <section id="services" className="py-28 bg-pink-50">
      <div className="max-w-7xl mx-auto px-6">
        <div className="text-center mb-16">
          <span className="text-rose-500 font-semibold text-sm uppercase tracking-wider">What We Offer</span>
          <h2 className="serif text-5xl md:text-6xl italic text-gray-900 mt-3 mb-4">Our <span className="gradient-text">Services</span></h2>
          <p className="text-gray-500 text-lg max-w-xl mx-auto">Premium beauty treatments tailored just for you</p>
        </div>
        <div ref={r} className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
          {svcs.map((s,i)=>(
            <div key={s.t} className={`bg-white rounded-3xl p-8 card-hover border-b-4 border-rose-400 ${v?'fade-up':'opacity-0'}`} style={{animationDelay:`${i*.1}s`}}>
              <div className="w-16 h-16 bg-pink-50 rounded-2xl flex items-center justify-center text-3xl mb-5">{s.i}</div>
              <h3 className="text-xl font-bold text-gray-900 mb-3">{s.t}</h3>
              <p className="text-gray-500 leading-relaxed text-sm mb-4">{s.d}</p>
              <span className="bg-rose-50 text-rose-600 font-bold text-sm px-4 py-1.5 rounded-full">{s.p}</span>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Pricing(){
  const[tab,setTab]=useState('Hair');
  const menus={
    Hair:[['Haircut (Short)','₹499'],['Haircut (Long)','₹699'],['Blow-Dry','₹399'],['Global Colour','₹1,499+'],['Highlights / Balayage','₹2,499+'],['Keratin Treatment','₹3,999+'],['Smoothening','₹4,999+']],
    Skin:[['Basic Clean-Up','₹699'],['De-Tan Facial','₹999'],['Gold Facial','₹1,299'],['Diamond Facial','₹1,599'],['Hydra Facial','₹2,499'],['Bleach (Full Face)','₹399'],['D-Tan Pack','₹599']],
    Nails:[['Manicure (Classic)','₹350'],['Pedicure (Classic)','₹450'],['Gel Manicure','₹799'],['Gel Pedicure','₹999'],['Nail Art (per nail)','₹50+'],['Acrylic Extensions','₹1,499'],['3D Nail Art','₹2,499']],
    Spa:[['Head Massage (30min)','₹499'],['Body Massage (60min)','₹1,499'],['Aromatherapy','₹1,999'],['Back Scrub','₹799'],['Foot Reflexology','₹899'],['Full Body Wax','₹1,199'],['D-Tan Body','₹1,299']],
  };
  return(
    <section id="pricing" className="py-28 bg-white">
      <div className="max-w-4xl mx-auto px-6">
        <div className="text-center mb-12">
          <span className="text-rose-500 font-semibold text-sm uppercase tracking-wider">Transparent Pricing</span>
          <h2 className="serif text-5xl italic text-gray-900 mt-3 mb-2">Price <span className="gradient-text">Menu</span></h2>
          <p className="text-gray-500">No hidden charges. What you see is what you pay.</p>
        </div>
        <div className="flex flex-wrap justify-center gap-2 mb-8">
          {Object.keys(menus).map(t=>(
            <button key={t} onClick={()=>setTab(t)} className={`px-6 py-2.5 rounded-full font-semibold transition-all ${tab===t?'bg-gradient-to-r from-rose-600 to-pink-600 text-white shadow-lg':'bg-pink-50 text-rose-600 hover:bg-pink-100'}`}>
              {t==='Hair'?'💇‍♀️ Hair':t==='Skin'?'✨ Skin':t==='Nails'?'💅 Nails':'🧖‍♀️ Spa'} {t}
            </button>
          ))}
        </div>
        <div className="bg-white rounded-3xl shadow-lg border border-pink-100 overflow-hidden">
          {menus[tab].map(([n,p],i)=>(
            <div key={n} className={`flex items-center justify-between px-8 py-4 ${i%2===0?'bg-pink-50/50':'bg-white'} hover:bg-pink-50 transition-colors`}>
              <span className="text-gray-700 font-medium">{n}</span>
              <span className="text-rose-600 font-black text-lg">{p}</span>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Gallery(){
  const items=[{e:'💇‍♀️',c:'from-rose-200 to-pink-200'},{e:'💄',c:'from-pink-300 to-purple-200'},{e:'💅',c:'from-red-200 to-rose-300'},{e:'✨',c:'from-yellow-100 to-pink-200'},{e:'👰',c:'from-rose-300 to-pink-400'},{e:'🧖‍♀️',c:'from-purple-100 to-pink-200'},{e:'🌸',c:'from-pink-100 to-rose-200'},{e:'💋',c:'from-rose-400 to-pink-300'}];
  return(
    <section id="gallery" className="py-28 bg-pink-50">
      <div className="max-w-7xl mx-auto px-6">
        <div className="text-center mb-12">
          <span className="text-rose-500 font-semibold text-sm uppercase tracking-wider">Portfolio</span>
          <h2 className="serif text-5xl italic text-gray-900 mt-3 mb-2">Our <span className="gradient-text">Gallery</span></h2>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {items.map((x,i)=>(
            <div key={i} className={`bg-gradient-to-br ${x.c} rounded-2xl h-48 flex items-center justify-center text-6xl hover:scale-105 transition-transform cursor-pointer shadow-sm`}>{x.e}</div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Team(){
  const team=[
    {a:'👩‍🎨',n:'Priya Kapoor',r:'Senior Hair Stylist',d:'12 years | TIGI & Schwarzkopf certified. Balayage & keratin specialist.'},
    {a:'👰',n:'Meena Sharma',r:'Bridal Makeup Artist',d:'500+ brides styled. HD & airbrush expert. VLCC trained.'},
    {a:'🧴',n:'Sonia Verma',r:'Skin Care Expert',d:'Certified dermal therapist. Hydra facial & advanced skin treatments.'},
    {a:'💅',n:'Ritu Malhotra',r:'Nail Art Artist',d:'8 years exp. Custom gel designs & 3D nail art specialist.'},
  ];
  return(
    <section id="team" className="py-28 bg-gradient-to-br from-rose-900 to-pink-900">
      <div className="max-w-7xl mx-auto px-6">
        <div className="text-center mb-16">
          <span className="text-pink-300 font-semibold text-sm uppercase tracking-wider">Our Artists</span>
          <h2 className="serif text-5xl italic text-white mt-3">Meet the <span className="text-pink-300">Team</span></h2>
        </div>
        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
          {team.map(t=>(
            <div key={t.n} className="glass rounded-2xl p-8 text-center card-hover">
              <div className="text-6xl mb-4">{t.a}</div>
              <h3 className="text-white font-bold text-lg mb-1">{t.n}</h3>
              <div className="text-pink-300 font-semibold text-sm mb-3">{t.r}</div>
              <p className="text-pink-100 text-xs leading-relaxed">{t.d}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Testimonials(){
  const reviews=[
    {n:'Ananya R.',r:'Bride – Feb 2025',t:'Got my bridal makeup done here — absolutely stunning! Priya understood exactly what I wanted. Cried happy tears seeing myself.'},
    {n:'Kavita M.',r:'Software Professional',t:"Best salon in South Delhi. Meena's keratin treatment made my frizzy hair silky smooth. Worth every penny!"},
    {n:'Pooja S.',r:'Homemaker',t:'The hydra facial is unreal — my skin was glowing for weeks. Ambiance is so relaxing, I fell asleep during the facial!'},
    {n:'Divya T.',r:'Student',t:'Love the nail art here. Ritu is so talented and patient. My friends keep asking where I got my nails done!'},
  ];
  return(
    <section className="py-28 bg-white">
      <div className="max-w-7xl mx-auto px-6">
        <div className="text-center mb-16">
          <span className="text-rose-500 font-semibold text-sm uppercase tracking-wider">Happy Clients</span>
          <h2 className="serif text-5xl italic text-gray-900 mt-3">What They <span className="gradient-text">Say</span></h2>
        </div>
        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
          {reviews.map(r=>(
            <div key={r.n} className="bg-pink-50 rounded-2xl p-7 card-hover border-l-4 border-rose-400">
              <div className="text-yellow-400 text-lg mb-4">★★★★★</div>
              <p className="text-gray-600 italic leading-relaxed text-sm mb-4">"{r.t}"</p>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-gradient-to-br from-rose-500 to-pink-600 rounded-full flex items-center justify-center text-white font-bold">{r.n[0]}</div>
                <div><div className="text-gray-900 font-bold text-sm">{r.n}</div><div className="text-rose-400 text-xs">{r.r}</div></div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Booking(){
  const[form,setForm]=useState({name:'',wa:'',date:'',service:'Hair Styling'});
  const[ok,setOk]=useState(false);
  return(
    <section id="book" className="py-28 bg-gradient-to-br from-rose-700 via-pink-700 to-rose-800">
      <div className="max-w-2xl mx-auto px-6 text-center">
        <h2 className="serif text-5xl italic text-white mb-3">Book Your <span className="text-pink-200">Appointment</span></h2>
        <p className="text-pink-100 mb-10 text-lg">Reserve your slot today — prior booking recommended</p>
        {ok?(
          <div className="glass rounded-3xl p-12">
            <div className="text-6xl mb-4">💄✅</div>
            <h3 className="text-2xl font-bold text-white mb-2">Appointment Booked!</h3>
            <p className="text-pink-200">We'll confirm via WhatsApp within 1 hour.</p>
            <button onClick={()=>setOk(false)} className="mt-6 text-pink-200 underline">Book another →</button>
          </div>
        ):(
          <form onSubmit={e=>{e.preventDefault();setOk(true)}} className="flex flex-col gap-4">
            <input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your Full Name" className="px-6 py-4 rounded-2xl border-2 border-white/30 bg-white/10 text-white placeholder-white/60 focus:border-white outline-none text-lg"/>
            <input required value={form.wa} onChange={e=>setForm({...form,wa:e.target.value})} placeholder="WhatsApp Number" className="px-6 py-4 rounded-2xl border-2 border-white/30 bg-white/10 text-white placeholder-white/60 focus:border-white outline-none text-lg"/>
            <input required type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} className="px-6 py-4 rounded-2xl border-2 border-white/30 bg-white/10 text-white outline-none text-lg"/>
            <select value={form.service} onChange={e=>setForm({...form,service:e.target.value})} className="px-6 py-4 rounded-2xl border-2 border-white/30 bg-rose-800 text-white outline-none text-lg">
              {['Hair Styling','Manicure & Pedicure','Facial & Skin Care','Waxing & Threading','Bridal Makeup','Spa & Relaxation'].map(s=><option key={s}>{s}</option>)}
            </select>
            <button type="submit" className="bg-white text-rose-700 py-4 rounded-2xl font-black text-xl hover:scale-105 transition-transform shadow-2xl">Book Now ✨</button>
          </form>
        )}
      </div>
    </section>
  );
}

function Footer(){
  return(
    <footer className="bg-rose-950 text-pink-300 py-16">
      <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-3 gap-10 mb-10">
        <div>
          <div className="serif text-2xl italic text-white mb-3">Blossom Beauty</div>
          <p className="text-sm leading-relaxed">Luxury beauty & wellness parlour in South Delhi. Expert stylists, premium products, unforgettable results.</p>
        </div>
        <div><h4 className="text-white font-bold mb-4">Services</h4>{['Hair Styling','Bridal Makeup','Facial & Skin','Spa & Wellness'].map(l=><div key={l} className="py-1 hover:text-white cursor-pointer transition-colors text-sm">{l}</div>)}</div>
        <div><h4 className="text-white font-bold mb-4">Contact Us</h4><div className="space-y-2 text-sm"><div>📍 Green Park Market, New Delhi</div><div>📞 +91 98110 77889</div><div>✉️ blossombeauty@gmail.com</div><div>⏰ Tue–Sun: 10 AM – 8 PM</div></div></div>
      </div>
      <div className="border-t border-rose-900 pt-8 text-center text-xs">© 2026 Blossom Beauty Parlour. All rights reserved.</div>
    </footer>
  );
}

function App(){
  return(<><OfferStrip/><Navbar/><Hero/><Stats/><Services/><Pricing/><Gallery/><Team/><Testimonials/><Booking/><Footer/></>);
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
